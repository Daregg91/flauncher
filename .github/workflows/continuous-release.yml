name: Fabrication de l'appli

# Fabrique l'APK à chaque modification envoyée sur master,
# puis la publie dans « Releases » (lien fixe : releases/latest).

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Fabriquer l'APK
    env:
      OUTPUT_DIR: 'build/app/outputs/flutter-apk'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Numéro de version
        id: version
        run: |
          echo "BUILD_NUMBER=$((1000 + ${{ github.run_number }}))" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=$(date '+%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Fabriquer
        env:
          # Clé de signature personnelle de l'appli (projet perso, non sensible).
          FLAUNCHER_KEYSTORE_PASSWORD: accueil-edgar-margot
          FLAUNCHER_SIGNING_KEY_ALIAS: accueil
          FLAUNCHER_SIGNING_KEY_PASSWORD: accueil-edgar-margot
        run: |
          cp android/app/edgar-release.jks android/app/upload-keystore.jks
          flutter --no-color build apk --release --build-number ${{ steps.version.outputs.BUILD_NUMBER }} --build-name=${{ steps.version.outputs.FULL_VERSION }}
          ls -la $OUTPUT_DIR
          cp $OUTPUT_DIR/app-release.apk accueil.apk
      - name: Garder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: accueil-apk
          path: accueil.apk
          retention-days: 30
      - name: Publier la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.FULL_VERSION }}" accueil.apk \
            --latest \
            --title "Accueil Edgar et Margot — ${{ steps.version.outputs.FULL_VERSION }}" \
            --notes "Version fabriquée automatiquement."
